# بناء تطبيق أندرويد لبصمة الشمراني (مجاني على GitHub)
# التطبيق بيفتح نفس الموقع alshomrani-co.github.io/basma، فأي تحديث للموقع بيوصل للتطبيق لوحده
# وبيضيف: لايف لوكيشن في الخلفية، إشعارات الجوال، وبصمة الإصبع الحقيقية
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor-community/background-geolocation@^1.2.27 @capgo/capacitor-native-biometric@^7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://alshomrani-co.github.io/basma/">' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.alshomrani.basma",
            "appName": "بصمة الشمراني",
            "webDir": "www",
            "server": { "url": "https://alshomrani-co.github.io/basma/", "androidScheme": "https" },
            "android": { "useLegacyBridge": true, "backgroundColor": "#ffffff" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Permissions, version and icon
        run: |
          cd app/android
          python3 - <<'PY'
          import re
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION',
                   'POST_NOTIFICATIONS', 'CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'USE_BIOMETRIC', 'WAKE_LOCK', 'VIBRATE', 'INTERNET']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if ('permission.' + x + '"') not in s)
          s = s.replace('</manifest>', add + '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          v = 'app/src/main/res/values/strings.xml'
          t = open(v, encoding='utf-8').read()
          t = t.replace('</resources>', '    <string name="capacitor_background_geolocation_notification_channel_name">Live location</string>\n    <string name="capacitor_background_geolocation_notification_color">#D7262B</string>\n</resources>')
          open(v, 'w', encoding='utf-8').write(t)
          g = 'app/build.gradle'
          b = open(g, encoding='utf-8').read()
          b = re.sub(r'versionCode \d+', 'versionCode ${{ github.run_number }}', b)
          b = re.sub(r'versionName "[^"]*"', 'versionName "1.${{ github.run_number }}"', b)
          open(g, 'w', encoding='utf-8').write(b)
          PY
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; px=${d##*:}
            mkdir -p app/src/main/res/mipmap-$n
            convert ../../logo-512.png -resize ${px}x${px} app/src/main/res/mipmap-$n/ic_launcher.png
            cp app/src/main/res/mipmap-$n/ic_launcher.png app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp app/src/main/res/mipmap-$n/ic_launcher.png app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Signing key (fixed, so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../basma-shamrani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basma-shamrani-apk
          path: basma-shamrani.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android ${{ github.run_number }}
          make_latest: true
          files: basma-shamrani.apk
          body: |
            ملف تطبيق بصمة الشمراني للأندرويد.
            رابط التحميل الثابت للموظفين: https://github.com/${{ github.repository }}/releases/latest/download/basma-shamrani.apk
